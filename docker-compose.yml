services:
  lifehub:
    build: .
    container_name: lifehub
    restart: unless-stopped
    ports:
      # Change the left number to use a different port on your machine.
      # To keep it private to this computer only, use "127.0.0.1:8000:8000".
      - "127.0.0.1:8000:8000"
    environment:
      TZ: America/Chicago   # affects what "today" means in apps
      DATA_DIR: /data
      LIFEHUB_USERNAME: ${LIFEHUB_USERNAME:-}
      LIFEHUB_PASSWORD: ${LIFEHUB_PASSWORD:-}
      LIFEHUB_PUBLIC_URL: ${LIFEHUB_PUBLIC_URL:-http://localhost:8000}
      LIFEHUB_ENCRYPTION_KEY: ${LIFEHUB_ENCRYPTION_KEY:-}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_SYNC_INTERVAL_SECONDS: ${PLAID_SYNC_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data:/data        # your database lives here — back this folder up
      # Dev mode: uncomment these two lines and the command below to hot-reload
      # - ./core:/app/core
      # - ./apps:/app/apps
    # command: uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload

{% macro donut(chart) %}
{% if chart.total %}<div class="donut-layout"><svg class="donut-svg" viewBox="0 0 200 200" role="img" aria-label="Purchase categories totaling {{ '%.2f'|format(chart.total / 100) }} dollars"><circle class="donut-track" cx="100" cy="100" r="76"/>{% for segment in chart.segments %}<circle class="donut-segment" cx="100" cy="100" r="76" pathLength="100" stroke="{{ segment.color }}" stroke-dasharray="{{ segment.percent }} {{ 100 - segment.percent }}" stroke-dashoffset="{{ -segment.offset }}" transform="rotate(-90 100 100)"><title>{{ segment.label }}: ${{ '%.2f'|format(segment.cents / 100) }} ({{ '%.1f'|format(segment.percent) }}%)</title></circle>{% endfor %}<text class="donut-label" x="100" y="90">PURCHASES</text><text class="donut-value" x="100" y="116">${{ '{:,.0f}'.format(chart.total / 100) }}</text></svg><ul class="chart-legend">{% for segment in chart.segments %}<li><span class="swatch" style="background:{{ segment.color }}"></span><span class="legend-label">{{ segment.label }}</span><span class="legend-value">${{ '{:,.2f}'.format(segment.cents / 100) }}</span><span class="legend-percent">{{ '%.0f'|format(segment.percent) }}%</span></li>{% endfor %}</ul></div>{% else %}<div class="empty empty-chart"><span>◌</span>No posted purchases this month.</div>{% endif %}
{% endmacro %}
